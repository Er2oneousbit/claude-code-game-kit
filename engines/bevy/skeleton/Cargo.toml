# ---------------------------------------------------------------------------
# Cargo.toml
# Purpose : The project manifest: name, version (the one version source, SOP-06), Bevy pin, build profiles.
# Usage   : python tools/dev.py check | test | smoke | build | run   (cargo underneath)
# Notes   : bevy = "0.20" takes 0.20.x patch releases; Cargo.lock (committed) pins the exact versions.
#           Moving to a new Bevy minor is a migration, not an update: docs/ENGINE.md gotcha 1.
#           The dev profile optimizes dependencies but not the game: debug builds stay quick to rebuild and
#           Bevy still runs at full speed (Bevy's own recommendation).
# Authored: Written with Claude (Opus 5.5, claude-opus-5-5)
# Updated : 2026-11-11 with Claude (Fable 5.1, claude-fable-5-1): the jpeg feature for generated characters' textures
#           2026-11-13 with Claude (Opus 5.5, claude-opus-5-5): the shader check example gets the game's own name (#294)
#           2026-11-14 with Claude (Opus 5.5, claude-opus-5-5): raw-window-handle and windows-sys on Windows (#308)
# Updated : 2026-11-18 with Claude (Opus 5.5, claude-opus-5-5): the optional `steam` feature (the steamworks crate,
#           the platform layer's Steam backend, #84); off by default
# ---------------------------------------------------------------------------
[package]
name = "{{GAME_SLUG}}"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
# jpeg: Bevy's defaults decode PNG only, and a generated character's textures are often JPEG (Tripo's are), so a
# rigged .glb would fail to load with InvalidImageMimeType("image/jpeg") (docs/ENGINE.md "Rigged characters")
bevy = { version = "0.20", features = ["jpeg"] }
# JSON for settings, saves and string tables (src/logic/); Bevy's default features build it anyway
serde_json = "1"
# Typed reading of the Dotwork asset manifests (src/dotwork/); Bevy already builds serde with derive
serde = { version = "1", features = ["derive"] }
# The platform layer's Steam backend (src/logic/platform_steam.rs, docs/PLATFORM.md): only with --features steam.
# MIT OR Apache-2.0; its -sys crate carries Valve's redistributable SDK files (read their terms before shipping)
steamworks = { version = "0.13", optional = true }

# Windows only: the monitor's work area and the window's frame, so a windowed size fits the screen
# (src/shell/display.rs); the versions Bevy's winit already builds, so nothing new is compiled
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[features]
# Faster rebuilds while developing: cargo run --features dev. Never ship it (docs/ENGINE.md gotcha 6).
dev = ["bevy/dynamic_linking"]
# The Steam backend for a Steam build: cargo build --release --features steam (docs/PLATFORM.md). Never needed for
# check, test or smoke: without it the game runs the null backend.
steam = ["dep:steamworks"]

# The shader check (dev.py smoke --shaders) under a name of this game's own (#294): cargo names examples without a
# hash, so every project sharing one CARGO_TARGET_DIR (docs/ENGINE.md) linked into one shader_check.pdb until MSVC
# stopped with LNK1140. dev.py reads the name from here; keep `path` as it is.
[[example]]
name = "{{GAME_SLUG}}_shader_check"
path = "examples/shader_check.rs"

[lints.clippy]
# Bevy systems take many parameters and spell out long query types by design
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
