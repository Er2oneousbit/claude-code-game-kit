; ---------------------------------------------------------------------------
; Game.ini (the GameKitShell plugin's own config layer)
; Purpose : Ships the project's data/ folder with a packaged game: the string tables (data/i18n), the input
;           presets, the colour palettes and whatever else the game keeps there, which the shell and the game read
;           at runtime from FPaths::ProjectDir().
; Usage   : nothing to do: Unreal layers an enabled plugin's Config/Game.ini over the project's DefaultGame.ini, so
;           `python tools/dev.py package` (and the editor's Package Project) stage data/ as loose files next to the
;           game, at <Packaged>/<Platform>/<Project>/data/, the same place FPaths::ProjectDir() points in the editor.
; Notes   : Paths are relative to the project's Content/ folder, hence "../data". NonUFS keeps the files loose
;           (outside the .pak), so a translator or a modder can still edit them in the shipped game. The plugin
;           carries the line, not the project's DefaultGame.ini, so `new_game.py --adopt` has nothing to merge.
;           Epic's own plugins stage folders the same way (NNERuntimeIREE).
; Authored: Written with Claude (Opus 5.5, claude-opus-5-5)
; ---------------------------------------------------------------------------
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysStageAsNonUFS=(Path="../data")
